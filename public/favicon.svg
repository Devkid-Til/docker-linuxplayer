<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241B3D"/>
      <stop offset="1" stop-color="#16102A"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- 终端提示符 ">" -->
  <path d="M 16 25 L 27 32 L 16 39" fill="none" stroke="#A78BFA"
        stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 光标块 "_▋" -->
  <rect x="34" y="24" width="14" height="16" rx="4" fill="url(#cursor)"/>
  <rect x="35" y="25.5" width="5" height="4" rx="2" fill="#C4B5FD" opacity="0.55"/>
</svg>
