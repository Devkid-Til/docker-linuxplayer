<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241B3D"/>
      <stop offset="1" stop-color="#16102A"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- 终端提示符 ">" -->
  <path d="M 12 26 L 22 33 L 12 40" fill="none" stroke="#A78BFA"
        stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 下划线 "_" -->
  <path d="M 26 38 L 36 38" fill="none" stroke="#A78BFA"
        stroke-width="5" stroke-linecap="round"/>
  <!-- 光标块 "▋" -->
  <rect x="40" y="26" width="12" height="14" rx="3" fill="url(#cursor)"/>
  <rect x="41.5" y="27.5" width="5" height="4" rx="2" fill="#C4B5FD" opacity="0.5"/>
</svg>
