# 内核玩家博客 · nginx 配置（docker 挂载替换默认，防爬虫批量下载）
# 手段：每 IP 限速（limit_req）+ 每 IP 并发连接限制（limit_conn）
#      + 已知爬虫/下载工具 User-Agent 过滤 + 空 UA 拒绝 + 慢速连接超时
# 注意：内容已公开在首页，此配置提高批量抓取成本，不保证绝对防下载

# 请求速率限制：每 IP 20 请求/秒（配合 burst 容忍突发）
limit_req_zone $binary_remote_addr zone=blog_limit:10m rate=20r/s;
# 并发连接限制：每 IP 同时在途连接数。
# 与 limit_req 互补——limit_req 只管「请求速率」，挡不住 Slowloris 这类
# 开几百条慢连接占满 worker_connections 的攻击；limit_conn 管的是「连接数」。
# 站点开了 http2，浏览器对同域复用 1 条 TCP 连接多路复用，正常用户常年 1~2 条，
# 20 对真人极宽松，对开大量裸连接者则是硬墙。
limit_conn_zone $binary_remote_addr zone=blog_conn:10m;

# HTTP → HTTPS 强制跳转（保留 Host，apex/www 各自回各自）
server {
    listen 80;
    server_name _;

    # 容器内健康检查端点：直接 200，不参与 301 跳转、不受 UA 过滤约束。
    # 为什么需要它：docker healthcheck 在容器内跑 `wget http://localhost/`，
    # 而 localhost 同时解析到 127.0.0.1 与 ::1（nginx 只监听 IPv4）→ 走 IPv6 被拒；
    # 退到 IPv4 又被 301 跳到 https://localhost/ → 证书 CN=kernelplayer.cn 校验失败。
    # 两条路都不通，healthcheck 永远失败（2026-09-18 发现，此前一直是 unhealthy）。
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# HTTPS（证书由 docker/ssl 挂载到容器 /etc/nginx/ssl）
server {
    listen 443 ssl;
    http2 on;
    server_name kernelplayer.cn www.kernelplayer.cn;

    ssl_certificate     /etc/nginx/ssl/kernelplayer.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/kernelplayer.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    limit_req zone=blog_limit burst=30 nodelay;
    limit_conn blog_conn 20;

    # 慢速连接超时加固（防 Slowloris 挂住连接不放；默认值均为 60s，过长）
    # 静态站无请求体上传，10s 对真人绰绰有余——浏览器要么立刻发完请求头，要么就是异常连接。
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    # keepalive 默认 75s；缩短到 30s 以更快回收空闲连接，释放 worker 连接槽位
    keepalive_timeout     30s;

    # 防爬 UA 过滤：默认挡脚本/下载工具与空 UA。
    # 例外：入口与订阅类文件（首页 / feed.xml / robots.txt）对脚本放行——
    # 阅读器、监控、CI 校验需要它们；正文页与静态资源（含图片）仍照挡，防批量下载。
    set $deny_ua 0;
    if ($http_user_agent ~* "(curl|wget|python-requests|python-urllib|scrapy|Go-http-client|libwww-perl|Java/|ApacheBench|HttpClient|okhttp|node-fetch)") {
        set $deny_ua 1;
    }
    if ($http_user_agent = "") {
        set $deny_ua 1;
    }
    # ↓ 例外必须写在上面之后：nginx 的 set 按出现顺序生效，后者覆盖前者
    if ($uri ~ ^/(index\.html)?$) {
        set $deny_ua 0;
    }
    if ($uri = /feed.xml) {
        set $deny_ua 0;
    }
    if ($uri = /robots.txt) {
        set $deny_ua 0;
    }
    if ($deny_ua = 1) {
        return 403;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 收款码图片不缓存：内容可能随时换（换码/裁切/换头像），
    # 7 天缓存会导致用户看到旧图。正则 location 按顺序匹配第一个，必须放通用规则前。
    location ~* ^/images/sponsor-.+\.(png|jpg|jpeg)$ {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
