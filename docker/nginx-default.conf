# 内核玩家博客 · nginx 配置（docker 挂载替换默认，防爬虫批量下载）
# 手段：每 IP 限速（limit_req）+ 已知爬虫/下载工具 User-Agent 过滤 + 空 UA 拒绝
# 注意：内容已公开在首页，此配置提高批量抓取成本（限速/UA 挡），不保证绝对防下载

limit_req_zone $binary_remote_addr zone=blog_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # 每 IP 限速：20r/s，突发 30（正常浏览足够，爬虫连抓被限）
    limit_req zone=blog_limit burst=30 nodelay;

    # 拒绝已知爬虫/下载工具的 User-Agent（curl/wget/python/scrapy 等）
    if ($http_user_agent ~* "(curl|wget|python-requests|python-urllib|scrapy|Go-http-client|libwww-perl|Java/|ApacheBench|HttpClient|okhttp|node-fetch)") {
        return 403;
    }
    # 空 UA 也拒绝（多数批量爬虫不设 UA）
    if ($http_user_agent = "") {
        return 403;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存（版本化文件名，可长缓存）
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 禁止访问隐藏文件 / 点文件
    location ~ /\. {
        deny all;
    }

    # 404 页
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
